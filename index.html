<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* 스테이지 진행도 바 스타일 추가 */
        .progress-container { width: 100%; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00e5ff; transition: width 0.3s; box-shadow: 0 0 10px #00e5ff; }
        .hp-fill { background: #ff4d4d; transition: width 0.3s; }
        .rk-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #444; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="lvl">STAGE <span id="level-num">1</span></div>
        <div class="hp-bar"><div id="hp-fill" class="hp-fill" style="width: 100%;"></div></div>
        <div class="progress-container"><div id="prog-fill" class="progress-fill"></div></div>
    </div>

    <div id="viewport" class="viewport">
        <div class="stats">SCORE: <span id="score">0</span><br>ALBEDO: <span id="albedo">85</span>%</div>
        <div id="toast" class="toast"></div>
        <div id="shield" class="shield">SHIELD</div>
        <div id="glacier" class="glacier"></div>

        <div id="start-screen" class="overlay">
            <div class="content-box">
                <h1 class="neon-text">GLACIER DEFENDER</h1>
                <div class="info-text">Protect the glacier from Black Carbon!<br><small style="opacity:0.7">Global ranking system is now LIVE.</small></div>
                <input type="text" id="user-name" placeholder="Enter name" maxlength="10">
                <button onclick="startGame()">START MISSION</button>
            </div>
        </div>

        <div id="result-screen" class="overlay" style="display:none;">
            <div class="content-box">
                <h2 id="result-title" class="neon-text">MISSION OVER</h2>
                <div class="final-val" id="final-score">0</div>
                <div class="ranking-box">
                    <small>GLOBAL TOP 5 (LIVE)</small>
                    <div id="rank-list">Loading...</div>
                </div>
                <button onclick="location.reload()">TRY AGAIN</button>
            </div>
        </div>
    </div>
</div>

<script>
// 고객님이 보내주신 파이어베이스 설정값 적용
const firebaseConfig = {
  apiKey: "AIzaSyCGalYZ5WTs4xZiXpUU8XKa9aDZchMzFCM",
  authDomain: "glacier-ranking.firebaseapp.com",
  projectId: "glacier-ranking",
  storageBucket: "glacier-ranking.firebasestorage.app",
  messagingSenderId: "15457584160",
  appId: "1:15457584160:web:d4c7090f026e80b61ca845",
  measurementId: "G-6XQXQZY9TY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 전 세계 랭킹 저장
window.saveRank = async function() {
    if (!game.name || game.score <= 0) return;
    try {
        await db.collection("rankings").add({
            n: game.name,
            s: game.score,
            t: firebase.firestore.FieldValue.serverTimestamp()
        });
        showRanks();
    } catch (e) { console.error(e); }
};

// 전 세계 랭킹 불러오기
window.showRanks = async function() {
    const list = document.getElementById('rank-list');
    try {
        const snapshot = await db.collection("rankings").orderBy("s", "desc").limit(5).get();
        list.innerHTML = snapshot.docs.map((doc, i) => `
            <div class="rk-item">
                <span>${i+1}. ${doc.data().n}</span>
                <b style="color:#00e5ff">${doc.data().s}</b>
            </div>
        `).join('') || "No records yet.";
    } catch (e) { list.innerHTML = "Connect to Database..."; }
};

// 게임 로직 업데이트 (진행도 바 & 시간 연장)
window.addEventListener('load', () => {
    if (typeof game !== 'undefined') {
        window.hitFail = function() {
            game.hp -= 4;
            document.getElementById('hp-fill').style.width = Math.max(0, game.hp) + "%";
            refresh();
            if (game.hp <= 0) endGame();
        };

        window.hitSuccess = function() {
            game.score += (10 * game.level);
            document.getElementById('score').innerText = game.score;
            if (game.hp < 100) { game.hp = Math.min(100, game.hp + 1); document.getElementById('hp-fill').style.width = game.hp + "%"; }
            refresh();

            // 진행도 바 업데이트 (600점 기준)
            let progress = ((game.score % 600) / 600) * 100;
            document.getElementById('prog-fill').style.width = progress + "%";

            if (game.score >= game.level * 600) { 
                game.level++;
                game.speed += 0.4;
                game.rate = Math.max(200, game.rate - 70);
                document.getElementById('level-num').innerText = game.level;
                clearInterval(spawnTimer);
                spawnTimer = setInterval(spawn, game.rate);
                const ts = document.getElementById('toast');
                ts.innerText = `LEVEL UP: STAGE ${game.level} 🏔️`;
                ts.style.top = "15px"; setTimeout(()=>ts.style.top="-50px", 2000);
                document.getElementById('prog-fill').style.width = "0%";
            }
        };
    }
});
</script>
</body>
</html>
